version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: deltastrategy_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deltastrategy_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE_NAME:-deltastrategy-web}:latest
    container_name: deltastrategy_web
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
    networks:
      - deltastrategy_network
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery:
    image: ${IMAGE_NAME:-deltastrategy-web}:latest
    container_name: deltastrategy_celery
    command: celery -A deltastrategy worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    networks:
      - deltastrategy_network
    depends_on:
      redis:
        condition: service_healthy
    restart: always

networks:
  deltastrategy_network:
    driver: bridge

volumes:
  redis_data:
