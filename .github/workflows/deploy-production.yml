name: Deploy Django to EC2

on:
  workflow_dispatch:

env:
  IMAGE_NAME: shyamtandeldev/deltastrategy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
    
    - name: Build completed
      run: echo "✅ Docker image built and pushed successfully!"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /var/www/app
          
          echo "Creating .env file from GitHub secrets..."
          cat > .env << 'EOF'
          DEBUG=${{ secrets.DEBUG }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          DELTA_API_KEY=${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET=${{ secrets.DELTA_API_SECRET }}
          DELTA_API_BASE=${{ secrets.DELTA_API_BASE }}
          
          DB_ENGINE=${{ secrets.DB_ENGINE }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_PEM=/var/www/app/ca.pem
          
          CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
          
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          EOF
          
          echo "Creating ca.pem file from GitHub secret..."
          echo "${{ secrets.DB_CA_PEM }}" > /var/www/app/ca.pem
          chmod 600 /var/www/app/ca.pem
          
          echo "Pulling latest Docker image..."
          docker pull ${{ env.IMAGE_NAME }}:latest
          
          echo "Stopping existing containers..."
          docker-compose down
          
          echo "Starting new containers..."
          export IMAGE_NAME=${{ env.IMAGE_NAME }}
          docker-compose pull
          docker-compose up -d
          
          echo "Running migrations..."
          docker-compose exec -T web python manage.py migrate
          
          echo "Collecting static files..."
          docker-compose exec -T web python manage.py collectstatic --noinput
          
          echo "Cleaning up unused Docker resources..."
          docker system prune -f
          
          echo "Deployment completed successfully!"
