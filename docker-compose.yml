version: '3.8'

services:
  web:
    build: .
    container_name: deltastrategy_web
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3