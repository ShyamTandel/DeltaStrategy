[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 0.0.0.0 --port 6379
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/redis.log

[program:django]
command=python manage.py runserver 0.0.0.0:8000
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/django.log
environment=DJANGO_SETTINGS_MODULE="deltastrategy.settings"

[program:celery_worker]
command=celery -A deltastrategy worker --loglevel=info --concurrency=4 --queues=celery,monitoring,strategy,emergency
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/celery_worker.log
environment=DJANGO_SETTINGS_MODULE="deltastrategy.settings"
startretries=3
startsecs=5

[program:celery_beat]
command=celery -A deltastrategy beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/celery_beat.log
environment=DJANGO_SETTINGS_MODULE="deltastrategy.settings"
startretries=3
startsecs=10

[group:deltastrategy]
programs=redis,django,celery_worker,celery_beat
priority=999